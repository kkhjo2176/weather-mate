# 모든 @SpringBootTest는 로컬/운영 MariaDB가 아닌 테스트 전용 H2 DB 사용.
spring.datasource.url=jdbc:h2:mem:weatherlife_tests;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
weather.collection.enabled=false
weather.collection.manual-enabled=false
kma.short.auth-key=TEST_DUMMY
kma.medium.service-key=TEST_DUMMY
