services:
  ai-api:
    build:
      context: .
      target: api
    init: true
    environment:
      PANGU_API_KEY: ${PANGU_API_KEY:?Set PANGU_API_KEY in your shell or local .env}
    ports:
      - "127.0.0.1:${PANGU_API_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${PANGU_HOST_DATA_DIR:-./data}
        target: /app/data
        read_only: true
    # Process liveness only. GET /health separately checks forecast availability.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Opt in with: docker compose --profile gpu up --build
  # Run only one updater (Docker OR local) for the same data directory.
  ai-updater:
    profiles: [gpu]
    build:
      context: .
      target: gpu
    init: true
    volumes:
      - type: bind
        source: ${PANGU_HOST_DATA_DIR:-./data}
        target: /app/data
      - type: bind
        source: ${PANGU_HOST_MODELS_DIR:-./models}
        target: /app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
