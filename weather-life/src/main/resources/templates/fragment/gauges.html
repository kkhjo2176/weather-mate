<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 하단 게이지: 자외선 지수 / 미세먼지 / 강수확률 / 바람 세기 -->
<section class="wl-gauges" th:fragment="gauges">
    <article class="wl-card wl-gauge" th:each="gauge : ${gauges}" th:classappend="${gauge.color}">
        <h3 class="wl-subtitle">
            <img th:src="@{${gauge.icon}}" alt="">
            <span th:text="${gauge.title}">자외선 지수</span>
        </h3>

        <div class="wl-gauge-body">
            <!-- pathLength=100 으로 두고 percent 만큼 stroke 를 채운다 -->
            <svg class="wl-gauge-arc" viewBox="0 0 120 66" aria-hidden="true">
                <path class="track" d="M10 60 A50 50 0 0 1 110 60" pathLength="100"/>
                <path class="fill" d="M10 60 A50 50 0 0 1 110 60" pathLength="100"
                      th:style="|stroke-dasharray: ${gauge.percent} 100|"/>
            </svg>
            <div class="wl-gauge-value">
                <strong><span th:text="${gauge.value}">2</span><small th:text="${gauge.unit}"></small></strong>
                <p th:text="${gauge.status}">낮음</p>
            </div>
        </div>
    </article>
</section>

</body>
</html>
